name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build (aapt2 + javac + d8, no Gradle)
        env:
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
        run: launcher/build-and-install.sh --no-install
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/build/CleanHome.apk)
          echo "APK: $((size / 1024)) KB"
          test "$size" -lt 409600 || { echo "APK is over 400 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }

  remote:
    name: Phone remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server compiles
        run: python3 -m py_compile remote/server.py
      - name: Page script parses
        run: |
          node -e 'const h=require("fs").readFileSync("remote/index.html","utf8");
                   new Function(h.slice(h.indexOf("<script>")+8,h.indexOf("</script>")))'
